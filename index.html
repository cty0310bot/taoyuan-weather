<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桃園市天氣</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 40px;
      width: 420px;
      box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3);
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .city {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .country {
      font-size: 14px;
      color: rgba(255,255,255,0.6);
      margin-top: 4px;
    }

    .datetime {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      margin-top: 8px;
    }

    .weather-main {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin: 20px 0;
    }

    .weather-icon {
      font-size: 80px;
      line-height: 1;
    }

    .temp-block {
      text-align: left;
    }

    .temperature {
      font-size: 72px;
      font-weight: 300;
      line-height: 1;
    }

    .temp-unit {
      font-size: 28px;
      vertical-align: super;
    }

    .description {
      font-size: 18px;
      color: rgba(255,255,255,0.8);
      margin-top: 6px;
    }

    .divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.15);
      margin: 24px 0;
    }

    .details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .detail-item {
      background: rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .detail-icon { font-size: 22px; }

    .detail-info { flex: 1; }

    .detail-label {
      font-size: 11px;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .detail-value {
      font-size: 18px;
      font-weight: 600;
      margin-top: 2px;
    }

    .forecast-title {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 14px;
    }

    .forecast-list {
      display: flex;
      gap: 10px;
      justify-content: space-between;
    }

    .forecast-item {
      background: rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 12px 10px;
      text-align: center;
      flex: 1;
    }

    .forecast-day {
      font-size: 12px;
      color: rgba(255,255,255,0.6);
    }

    .forecast-icon { font-size: 22px; margin: 6px 0; }

    .forecast-temp {
      font-size: 14px;
      font-weight: 600;
    }

    .forecast-low {
      font-size: 11px;
      color: rgba(255,255,255,0.5);
      margin-top: 2px;
    }

    .loading {
      text-align: center;
      padding: 40px 0;
      font-size: 16px;
      color: rgba(255,255,255,0.6);
    }

    .loading-spinner {
      font-size: 40px;
      animation: spin 1.5s linear infinite;
      display: block;
      margin-bottom: 12px;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .error {
      text-align: center;
      color: #ff6b6b;
      padding: 20px 0;
    }

    .update-time {
      text-align: center;
      font-size: 11px;
      color: rgba(255,255,255,0.35);
      margin-top: 20px;
    }

    .refresh-btn {
      display: block;
      margin: 16px auto 0;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      color: white;
      padding: 8px 24px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s;
    }

    .refresh-btn:hover {
      background: rgba(255,255,255,0.25);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="city">桃園市</div>
      <div class="country">台灣 · Taoyuan City, Taiwan</div>
      <div class="datetime" id="datetime"></div>
    </div>

    <div id="weather-content">
      <div class="loading">
        <span class="loading-spinner">⏳</span>
        正在載入天氣資料...
      </div>
    </div>
  </div>

  <script>
    // 桃園市座標
    const LAT = 24.9936;
    const LON = 121.3010;

    const WMO_CODES = {
      0:  { label: '晴天', icon: '☀️' },
      1:  { label: '大致晴朗', icon: '🌤️' },
      2:  { label: '局部多雲', icon: '⛅' },
      3:  { label: '陰天', icon: '☁️' },
      45: { label: '霧', icon: '🌫️' },
      48: { label: '霧淞', icon: '🌫️' },
      51: { label: '毛毛雨(輕)', icon: '🌦️' },
      53: { label: '毛毛雨(中)', icon: '🌦️' },
      55: { label: '毛毛雨(強)', icon: '🌧️' },
      61: { label: '小雨', icon: '🌧️' },
      63: { label: '中雨', icon: '🌧️' },
      65: { label: '大雨', icon: '🌧️' },
      71: { label: '小雪', icon: '🌨️' },
      73: { label: '中雪', icon: '❄️' },
      75: { label: '大雪', icon: '❄️' },
      80: { label: '陣雨', icon: '🌦️' },
      81: { label: '陣雨(中)', icon: '🌧️' },
      82: { label: '大陣雨', icon: '⛈️' },
      95: { label: '雷雨', icon: '⛈️' },
      96: { label: '雷雨夾冰雹', icon: '⛈️' },
      99: { label: '強雷雨夾冰雹', icon: '🌩️' },
    };

    function getWeatherInfo(code) {
      return WMO_CODES[code] || { label: '未知', icon: '🌡️' };
    }

    function getWindDirection(deg) {
      const dirs = ['北', '東北', '東', '東南', '南', '西南', '西', '西北'];
      return dirs[Math.round(deg / 45) % 8];
    }

    function formatDay(dateStr) {
      const date = new Date(dateStr);
      const days = ['日', '一', '二', '三', '四', '五', '六'];
      return '週' + days[date.getDay()];
    }

    function updateDateTime() {
      const now = new Date();
      const opts = {
        timeZone: 'Asia/Taipei',
        year: 'numeric', month: 'long', day: 'numeric',
        weekday: 'long', hour: '2-digit', minute: '2-digit'
      };
      document.getElementById('datetime').textContent =
        now.toLocaleDateString('zh-TW', opts);
    }

    async function fetchWeather() {
      const url = `https://api.open-meteo.com/v1/forecast?` +
        `latitude=${LAT}&longitude=${LON}` +
        `&current=temperature_2m,relative_humidity_2m,apparent_temperature,` +
        `weather_code,wind_speed_10m,wind_direction_10m,uv_index` +
        `&daily=weather_code,temperature_2m_max,temperature_2m_min` +
        `&timezone=Asia%2FTaipei&forecast_days=5`;

      const res = await fetch(url);
      if (!res.ok) throw new Error('API 請求失敗');
      return res.json();
    }

    function renderWeather(data) {
      const c = data.current;
      const d = data.daily;
      const weather = getWeatherInfo(c.weather_code);

      const html = `
        <div class="weather-main">
          <div class="weather-icon">${weather.icon}</div>
          <div class="temp-block">
            <div class="temperature">${Math.round(c.temperature_2m)}<span class="temp-unit">°C</span></div>
            <div class="description">${weather.label}</div>
          </div>
        </div>

        <hr class="divider">

        <div class="details-grid">
          <div class="detail-item">
            <span class="detail-icon">🌡️</span>
            <div class="detail-info">
              <div class="detail-label">體感溫度</div>
              <div class="detail-value">${Math.round(c.apparent_temperature)}°C</div>
            </div>
          </div>
          <div class="detail-item">
            <span class="detail-icon">💧</span>
            <div class="detail-info">
              <div class="detail-label">相對濕度</div>
              <div class="detail-value">${c.relative_humidity_2m}%</div>
            </div>
          </div>
          <div class="detail-item">
            <span class="detail-icon">💨</span>
            <div class="detail-info">
              <div class="detail-label">風速</div>
              <div class="detail-value">${c.wind_speed_10m} km/h</div>
            </div>
          </div>
          <div class="detail-item">
            <span class="detail-icon">🧭</span>
            <div class="detail-info">
              <div class="detail-label">風向</div>
              <div class="detail-value">${getWindDirection(c.wind_direction_10m)}風</div>
            </div>
          </div>
          <div class="detail-item">
            <span class="detail-icon">🔆</span>
            <div class="detail-info">
              <div class="detail-label">紫外線指數</div>
              <div class="detail-value">${c.uv_index ?? 'N/A'}</div>
            </div>
          </div>
          <div class="detail-item">
            <span class="detail-icon">📍</span>
            <div class="detail-info">
              <div class="detail-label">海拔高度</div>
              <div class="detail-value">${data.elevation} m</div>
            </div>
          </div>
        </div>

        <hr class="divider">

        <div class="forecast-title">未來 5 天預報</div>
        <div class="forecast-list">
          ${d.time.map((day, i) => {
            const fw = getWeatherInfo(d.weather_code[i]);
            const isToday = i === 0;
            return `
              <div class="forecast-item">
                <div class="forecast-day">${isToday ? '今天' : formatDay(day)}</div>
                <div class="forecast-icon">${fw.icon}</div>
                <div class="forecast-temp">${Math.round(d.temperature_2m_max[i])}°</div>
                <div class="forecast-low">${Math.round(d.temperature_2m_min[i])}°</div>
              </div>`;
          }).join('')}
        </div>

        <div class="update-time">資料來源：Open-Meteo · 最後更新：${new Date().toLocaleTimeString('zh-TW')}</div>
        <button class="refresh-btn" onclick="loadWeather()">重新整理</button>
      `;

      document.getElementById('weather-content').innerHTML = html;
    }

    function renderError(msg) {
      document.getElementById('weather-content').innerHTML = `
        <div class="error">
          <div style="font-size:40px">⚠️</div>
          <p style="margin-top:12px">${msg}</p>
          <button class="refresh-btn" onclick="loadWeather()">重試</button>
        </div>`;
    }

    async function loadWeather() {
      document.getElementById('weather-content').innerHTML = `
        <div class="loading">
          <span class="loading-spinner">⏳</span>
          正在載入天氣資料...
        </div>`;
      try {
        const data = await fetchWeather();
        renderWeather(data);
      } catch (e) {
        renderError('無法取得天氣資料，請檢查網路連線後重試。');
      }
    }

    updateDateTime();
    setInterval(updateDateTime, 60000);
    loadWeather();
  </script>
</body>
</html>
